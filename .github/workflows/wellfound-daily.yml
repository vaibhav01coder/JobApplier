name: Wellfound Daily Apply

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC
    - cron: '30 2 * * *'

  workflow_dispatch:

jobs:
  wellfound:
    runs-on: ubuntu-latest

    env:
      APPLY_LIVE: "true"
      TARGET_LOCATIONS: "India||Hyderabad||Bengaluru||Bangalore||Pune||Mumbai||Delhi NCR||Remote India"
      MIN_SKILL_MATCHES: "3"
      MAX_APPLICATIONS: "50"
      MAX_SCAN_JOBS: "150"
      INCLUDE_OFF_PLATFORM: "false"
      WELLFOUND_JOBS_URL: "https://wellfound.com/jobs"
      JOB_CARD_SELECTOR: ".styles_component__uTjje"
      APPLICATIONS_CSV: "applications-wellfound.csv"
      LOG_DRY_RUN_TO_CSV: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers with Ubuntu dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Wellfound automation
        run: npx playwright test tests/wellfound.spec.js
