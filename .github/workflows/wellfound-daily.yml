name: Wellfound Daily Apply

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC
    - cron: '30 2 * * *'

  workflow_dispatch:

jobs:
  wellfound:
    runs-on: ubuntu-latest

    env:
      # ── Bot behaviour ──────────────────────────────────────────────────────
      APPLY_LIVE: "true"
      TARGET_LOCATIONS: "India||Hyderabad||Bengaluru||Bangalore||Pune||Mumbai||Delhi NCR||Remote India"
      TARGET_ROLES: "internship"
      MIN_SKILL_MATCHES: "1"
      MIN_APPLY_TARGET: "10"
      MAX_APPLICATIONS: "50"
      MAX_SCAN_JOBS: "150"
      INCLUDE_OFF_PLATFORM: "false"
      WELLFOUND_JOBS_URL: "https://wellfound.com/jobs"
      JOB_CARD_SELECTOR: ".styles_component__uTjje"
      APPLICATIONS_CSV: "applications-wellfound.csv"
      LOG_DRY_RUN_TO_CSV: "false"

      # ── Identity (from secrets) ────────────────────────────────────────────
      NAME: ${{ secrets.NAME }}
      EMAIL: ${{ secrets.EMAIL }}
      PHONE: ${{ secrets.PHONE }}
      LOCATION: ${{ secrets.LOCATION }}
      CURRENT_ROLE: ${{ secrets.CURRENT_ROLE }}
      COMPANY: ${{ secrets.COMPANY }}
      EDUCATION: ${{ secrets.EDUCATION }}
      YEARS_EXPERIENCE: ${{ secrets.YEARS_EXPERIENCE }}
      SKILLS: ${{ secrets.SKILLS }}
      HIGHLIGHTS: ${{ secrets.HIGHLIGHTS }}

      # ── Application answers (from secrets) ────────────────────────────────
      NOTICE_PERIOD: ${{ secrets.NOTICE_PERIOD }}
      CURRENT_CTC: ${{ secrets.CURRENT_CTC }}
      EXPECTED_CTC: ${{ secrets.EXPECTED_CTC }}
      DOB: ${{ secrets.DOB }}
      GENDER: ${{ secrets.GENDER }}

      # ── Links (from secrets) ───────────────────────────────────────────────
      GITHUB_URL: ${{ secrets.GITHUB_URL }}
      LINKEDIN_URL: ${{ secrets.LINKEDIN_URL }}
      PORTFOLIO_URL: ${{ secrets.PORTFOLIO_URL }}

      # ── Wellfound credentials (from secrets) ──────────────────────────────
      WELLFOUND_EMAIL: ${{ secrets.WELLFOUND_EMAIL }}
      WELLFOUND_PASSWORD: ${{ secrets.WELLFOUND_PASSWORD }}
      WELLFOUND_LOGIN_URL: "https://wellfound.com/login"
      WELLFOUND_AFTER_LOGIN_URL: "https://wellfound.com/jobs"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers with Ubuntu dependencies
        run: npx playwright install --with-deps chromium

      - name: Login to Wellfound and save session
        run: node save-wellfound-storage-state.js

      - name: Run Wellfound automation
        run: npx playwright test tests/wellfound.spec.js

      - name: Upload applications CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applications-run-${{ github.run_number }}
          path: applications-wellfound.csv
          if-no-files-found: warn

      - name: Email results to Gmail
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          JOB_STATUS: ${{ job.status }}
        run: node send-results-email.js
